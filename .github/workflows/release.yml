name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
  DOTNET_NOLOGO: '1'

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = ./eng/get-version.ps1 -Tag $env:RELEASE_TAG
          "version=$version" >> $env:GITHUB_OUTPUT

  verify:
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify and prepare the release package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./eng/prepare-release.ps1 -Tag $env:RELEASE_TAG
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-tests-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            artifacts/verification/*/run.json
            artifacts/verification/*/path-state.json
            artifacts/verification/*/test-results/**
            artifacts/verification/*/checks/**
            artifacts/verification/*/release-tests/result.json
            artifacts/verification/*/package-smoke/**
          if-no-files-found: warn
      - name: Preserve verified release files
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.version.outputs.version }}
          path: artifacts/release/${{ needs.version.outputs.version }}/*
          if-no-files-found: error
          retention-days: 30

  nuget:
    needs: [version, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.version.outputs.version }}
          path: artifacts/publish
      - name: Validate publication inputs
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw 'Set NUGET_USER in the nuget environment.'
          }
          ./eng/verify-release-assets.ps1 -Version $env:RELEASE_VERSION -Directory artifacts/publish
      - name: Authenticate to NuGet.org
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish the library
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet nuget push "artifacts/publish/Spdx.Expressions.$env:RELEASE_VERSION.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) {
            throw 'NuGet publication failed for Spdx.Expressions.'
          }

  github-release:
    needs: [version, nuget]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.version.outputs.version }}
          path: artifacts/publish
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./eng/publish-github-release.ps1 -Tag $env:RELEASE_TAG -Directory artifacts/publish
