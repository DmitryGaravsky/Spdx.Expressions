name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - name: Restore, test, format and verify both NuGet packages
        run: ./eng/verify.ps1
      - name: Upload test results and verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            artifacts/latest-verification.json
            artifacts/verification/*/run.json
            artifacts/verification/*/path-state.json
            artifacts/verification/*/test-results/**
            artifacts/verification/*/checks/**
            artifacts/verification/*/*documentation.log
            artifacts/verification/*/documentation-tests/result.json
            artifacts/verification/*/release-tests/result.json
            artifacts/verification/*/package-smoke/**
            artifacts/verification/*/compliance-smoke/**
          if-no-files-found: warn
      - name: Upload verified development packages
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: development-package-${{ github.run_attempt }}
          path: artifacts/verification/*/packages/*.nupkg
          if-no-files-found: error
