name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore, test, format and verify the real package
        run: ./eng/verify.ps1
      - name: Upload test results and verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            artifacts/latest-verification.json
            artifacts/verification/*/run.json
            artifacts/verification/*/path-state.json
            artifacts/verification/*/test-results/**
            artifacts/verification/*/checks/**
            artifacts/verification/*/release-tests/result.json
            artifacts/verification/*/package-smoke/**
          if-no-files-found: warn
      - name: Upload verified local development package
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: development-package-${{ github.run_attempt }}
          path: artifacts/verification/*/packages/*.nupkg
          if-no-files-found: error
